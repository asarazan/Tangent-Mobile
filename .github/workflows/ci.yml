name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test Android app
        run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: androidApp/build/reports/tests

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: temurin
          java-version: '17'

      - name: Export JAVA_HOME for whole job
        run: echo "JAVA_HOME=${{ steps.setup-java.outputs.path }}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-1.7.20

      - name: Build shared iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      # CocoaPods integrates the KMP framework via a "Build shared" run-script phase
      # (no declared outputs) that shells out to `./gradlew :shared:syncFramework`.
      # On a clean checkout, Xcode's explicit-module dependency scan can run before
      # that script phase produces the framework in the location the generated
      # Pods-iosApp xcconfig searches (shared/build/cocoapods/framework), causing
      # "unable to resolve module dependency: 'shared'" even though the script
      # phase succeeds moments later. Pre-syncing the framework for both simulator
      # archs here, before pod install / xcodebuild ever run, avoids that race.
      - name: Pre-sync shared framework for CocoaPods (avoid Xcode explicit-module scan race)
        run: |
          ./gradlew :shared:syncFramework \
            -Pkotlin.native.cocoapods.platform=iphonesimulator \
            -Pkotlin.native.cocoapods.archs="arm64 x86_64" \
            -Pkotlin.native.cocoapods.configuration=Debug

      - name: Pod install
        working-directory: iosApp
        run: pod install

      - name: Build iOS app
        run: |
          xcodebuild -workspace iosApp/iosApp.xcworkspace -scheme iosApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
